name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend-tests:
    name: Tests backend (pytest + coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ecommerce-click-and-buy/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ecommerce-click-and-buy/backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Ejecutar tests (falla si el coverage es menor a 60%)
        run: pytest --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: ecommerce-click-and-buy/backend/coverage.xml

  frontend-build:
    name: Build frontend (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ecommerce-click-and-buy/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ecommerce-click-and-buy/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    name: Build y smoke test de la imagen Docker
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen
        run: docker build -t click-and-buy ecommerce-click-and-buy
      - name: Levantar contenedor y verificar /api/health, /api/products y /apidocs
        run: |
          docker run -d --name app -p 5000:5000 click-and-buy
          for i in $(seq 1 30); do
            curl -fs http://localhost:5000/api/health && break
            sleep 2
          done
          curl -fs http://localhost:5000/api/health
          test "$(curl -fs http://localhost:5000/api/products | python3 -c 'import json,sys; print(len(json.load(sys.stdin)) > 0)')" = "True"
          curl -fs http://localhost:5000/apidocs/ > /dev/null
          curl -fs http://localhost:5000/ | grep -q '<div id="app">'
      - name: Logs del contenedor
        if: always()
        run: docker logs app

  deploy:
    name: Desplegar en Render
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Llamar al Deploy Hook de Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::warning::Falta el secret RENDER_DEPLOY_HOOK; se omite el despliegue."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
